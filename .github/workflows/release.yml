name: Release Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Clean Package
        run: |
          mkdir -p package/dnd-compendium-pt-br
          cp -r assets lang packs scripts module.json README.md package/dnd-compendium-pt-br/
          find package/dnd-compendium-pt-br -name "LOCK" -delete || true
          find package/dnd-compendium-pt-br -name "LOG*" -delete || true
          find package/dnd-compendium-pt-br -name "*.log" -delete || true
          cd package
          zip -r ../dnd-compendium-pt-br.zip dnd-compendium-pt-br
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }} - D&D 5e Compêndios Básicos PT-BR (PHB 2024, MM, DMG)
          body: |
            ## 🐉 D&D 5e Compêndios Básicos PT-BR (PHB 2024, MM, DMG) - ${{ github.ref_name }}

            Compêndios completos em Português Brasileiro (PT-BR) para o sistema D&D 5e no Foundry VTT, cobrindo as regras oficiais da edição 2024/2025: **Livro do Jogador (PHB 2024)**, **Manual dos Monstros (MM 2025)** e **Livro do Mestre (DMG 2024)**.

            ### ⚡ Instalação Direta no Foundry VTT (Manifest URL)
            Cole o link abaixo em **Add-on Modules** > **Install Module** > **Manifest URL**:
            ```text
            https://github.com/Crespo767/d-d-pt-br-compendium/releases/latest/download/module.json
            ```

            ### 📦 Conteúdo desta Versão
            - **Personagens e Monstros (745 itens)**: 12 classes do PHB 2024, subclasses, espécies, antecedentes e características do Manual dos Monstros.
            - **Atores (608 criaturas e personagens)**: Bestiário do MM 2025 completo por tipo e 48 fichas pré-geradas para jogadores (níveis 1 a 17).
            - **Itens de Inventário (1.524 itens)**: Armas com maestria (`weaponMastery`), armaduras, equipamentos, magias (truque ao 9º círculo) e itens mágicos do DMG.
            - **Cenas do Livro do Mestre (33 mapas)**: Mapas táticos e de masmorras do DMG e mapas de campanha de Greyhawk / Flanaess.
            - **Tabelas de Rolagem (312 tabelas)**: Tabelas do PHB 2024, DMG e MM.
            - **Localização**: dicionário `pt-BR.json`.

            ### 🦇 Módulo Complementar de Ravenloft
            Para a campanha de Baróvia e suplementos de horror, utilize:
            [Curse of Strahd & Ravenloft | Compêndios PT-BR](https://github.com/Crespo767/curse-of-strahd-pt-br)

            ### 📦 Download Manual
            - [dnd-compendium-pt-br.zip](https://github.com/Crespo767/d-d-pt-br-compendium/releases/download/${{ github.ref_name }}/dnd-compendium-pt-br.zip)
          files: |
            dnd-compendium-pt-br.zip
            module.json
          draft: false
          prerelease: false
